name: Qualidade dos dados e sintaxe JavaScript

on:
  push:
    branches: [main]
    paths:
      - "assets/js/**"
      - "index.html"
      - "README.md"
      - "docs/data-provenance.md"
      - "scripts/**"
      - "data/iara/iara_municipios_rmb.csv"
      - "data/iara/iara_municipios_rmb.json"
      - "tests/**"
      - ".github/workflows/data-quality.yml"
  pull_request:
    paths:
      - "assets/js/**"
      - "index.html"
      - "README.md"
      - "docs/data-provenance.md"
      - "scripts/**"
      - "data/iara/iara_municipios_rmb.csv"
      - "data/iara/iara_municipios_rmb.json"
      - "tests/**"
      - ".github/workflows/data-quality.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validar parser, dados e sintaxe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar sintaxe JavaScript
        run: |
          node --check assets/js/dataUtils.js
          node --check assets/js/charts.js
          node --check assets/js/main.js
          node --check assets/js/storytelling.js

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências do pipeline de dados
        run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Verificar sintaxe do pipeline Python
        run: python -m py_compile scripts/build_iara_municipios_rmb.py scripts/patch_data.py

      - name: Testar validação de registros SIH
        run: python -m unittest discover -s tests -p 'test_sih_etl.py' -v

      - name: Executar testes do parser e da qualidade de dados
        run: node --test tests/dataUtils.test.cjs


  sih_pilot:
    name: Piloto SIH-RD nacional (2023-01)
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/sih-pilot-2023-01'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências do piloto
        run: python -m pip install --disable-pip-version-check pandas "pysus==2.11.7"

      - name: Testar funções de filtragem e agregação
        run: python -m unittest discover -s tests -p 'test_sih_pilot_2023_01.py' -v

      - name: Executar extração SIH-RD em todas as UFs
        run: python scripts/sih_pilot_2023_01.py --output ./sih_pilot_output

      - name: Publicar somente relatórios agregados e proveniência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iara-sih-pilot-2023-01-audit
          path: |
            sih_pilot_output/inventario_dbc.csv
            sih_pilot_output/cobertura_arquivos_por_uf.csv
            sih_pilot_output/resumo_por_municipio_uf_ident.csv
            sih_pilot_output/repeticoes_n_aih_resumo.csv
            sih_pilot_output/erros_execucao.csv
            sih_pilot_output/metadados_execucao.json
          if-no-files-found: warn
          retention-days: 7
